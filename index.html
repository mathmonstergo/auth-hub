<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>auth-hub</title>
<style>
:root {
  --bg: #F6F8FA;
  --line: #E2E8F0;
  --tx: #0F172A;
  --muted: #64748B;
  --accent: #0284C7;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--tx);
  font: 400 14px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}
main { width: 100%; max-width: 560px; }
h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 30px; }
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 28px 0 10px; letter-spacing: .02em; }
ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line);
}
li span:last-child { color: var(--muted); }
a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 160ms var(--ease);
}
a:hover { border-bottom-color: var(--accent); }
footer { margin-top: 32px; color: var(--muted); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>auth-hub</h1>
  <p class="sub">自用的多平台凭据中枢，给本机程序统一提供 Cookie / 登录态，主要对接 <a href="https://github.com/NanmiCoder/MediaCrawler">MediaCrawler</a> 做采集。</p>

  <h2>支持平台</h2>
  <ul>
    <li><span>哔哩哔哩</span><span>扫码登录</span></li>
    <li><span>小红书</span><span>Cookie</span></li>
    <li><span>抖音</span><span>Cookie</span></li>
    <li><span>微博</span><span>Cookie</span></li>
    <li><span>百度贴吧</span><span>Cookie</span></li>
    <li><span>知乎</span><span>Cookie</span></li>
  </ul>

  <footer>Personal use only · <a href="https://github.com/mathmonstergo/auth-hub">GitHub</a></footer>
</main>
</body>
</html>
